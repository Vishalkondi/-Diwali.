# Local PostgreSQL for Utsavly. Port 5434 on the host so it never clashes
# with a Postgres you may already run on 5432 (or 5433).
services:
  db:
    image: postgres:17-alpine
    container_name: diya-dash-db
    environment:
      POSTGRES_USER: diyadash
      POSTGRES_PASSWORD: diyadash
      POSTGRES_DB: diyadash
    ports:
      - "5434:5432"
    volumes:
      - diya-dash-pg:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diyadash -d diyadash"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  diya-dash-pg:
